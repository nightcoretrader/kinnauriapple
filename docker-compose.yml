services:
  postgres:
    image: postgres:16-alpine
    container_name: kinnaur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinnaur
      POSTGRES_PASSWORD: kinnaur
      POSTGRES_DB: kinnaur
    ports:
      - "55432:5432"
    volumes:
      - kinnaur_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinnaur -d kinnaur"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: kinnaur-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  kinnaur_pgdata:
